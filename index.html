<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    background: #f8fafc;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; touch-action: manipulation; -webkit-appearance: none; appearance: none; }

  /* Trygg sone: hakk, Dynamic Island og hjemmelinje */
  .wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
    z-index: 1;
    padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
    padding-right: calc(env(safe-area-inset-right, 0px) + 20px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
    padding-left: calc(env(safe-area-inset-left, 0px) + 20px);
  }

  /* Konfetti-backdrop */
  #confetti {
    position: fixed; inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .drop {
    position: absolute;
    top: -100px;
    line-height: 1;
    user-select: none; -webkit-user-select: none;
    will-change: transform;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .piece {
    position: absolute;
    top: -30px;
    pointer-events: none;
    will-change: transform;
    animation-name: fall, flutter;
    animation-timing-function: linear, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
  }
  @keyframes flutter {
    0%, 100% { margin-left: 0; }
    50% { margin-left: var(--sway, 20px); }
  }
  @keyframes fall {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(var(--drift, 0px), calc(100vh + 160px), 0) rotate(var(--spin, 360deg)); }
  }
  @media (prefers-reduced-motion: reduce) { #confetti { display: none; } }

  /* Hovedknapp */
  #flexBtn {
    width: min(288px, 82vw); height: 200px;
    border-radius: 28px;
    border: 2px solid #e2e8f0;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 15px 40px rgba(15,23,42,.12);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    transition: background .3s, border-color .3s, color .3s, box-shadow .2s, transform .2s;
  }
  @media (hover: hover) { #flexBtn:hover:not(.on):not(.paused) { background: #f1f5f9; } }
  #flexBtn:active { transform: scale(.96); }
  #flexBtn.on {
    background: #22c55e; border-color: #16a34a; color: #fff;
    transform: scale(1.04);
    box-shadow: 0 20px 50px rgba(34,197,94,.28);
  }
  #flexBtn.on:active { transform: scale(1); }
  #flexBtn.paused {
    background: #f59e0b; border-color: #d97706; color: #fff;
    transform: scale(1.02);
    box-shadow: 0 20px 50px rgba(245,158,11,.28);
  }
  #flexBtn svg { width: 44px; height: 44px; }
  .label { font-size: 34px; font-weight: 600; line-height: 1; }
  .timer { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }

  /* Pause (min. 44 px trykkflate) */
  #pauseBtn {
    margin-top: 22px;
    min-height: 48px;
    padding: 10px 28px;
    font-size: 17px; font-weight: 600;
    border-radius: 999px;
    border: 2px solid #f59e0b;
    background: #fff; color: #b45309;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    -webkit-user-select: none; user-select: none;
    transition: background .2s, color .2s, opacity .2s;
  }
  #pauseBtn:active:not(:disabled) { background: #fffbeb; }
  #pauseBtn:disabled { opacity: .35; cursor: not-allowed; border-color: #cbd5e1; color: #64748b; }
  #pauseBtn.resume { background: #f59e0b; color: #fff; }
  #pauseBtn.resume:active { background: #d97706; }
  #pauseBtn svg { width: 18px; height: 18px; }

  #status { margin-top: 18px; font-size: 18px; font-weight: 500; color: #64748b; min-height: 27px; }
  #status.on { color: #15803d; font-weight: 600; }
  #status.paused { color: #b45309; }

  /* Dagsoversikt */
  .card {
    margin-top: 32px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 20px;
    text-align: left;
    box-shadow: 0 6px 20px rgba(15,23,42,.06);
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 { margin: 0; font-size: 18px; }
  .date { font-size: 13px; color: #94a3b8; text-transform: capitalize; }
  .total {
    margin: 14px 0 12px;
    padding: 14px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .total .t-label { font-size: 14px; color: #166534; }
  .total .t-value { font-size: 26px; font-weight: 700; color: #15803d; font-variant-numeric: tabular-nums; }
  .count { font-size: 13px; color: #64748b; margin-bottom: 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px;
    min-height: 44px;
    border-top: 1px solid #f1f5f9;
    font-size: 16px;
  }
  li .time { color: #475569; font-variant-numeric: tabular-nums; }
  li .dur { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; margin-right: 6px; }
  li.live .time::after { content: " • pågår"; color: #16a34a; font-weight: 600; }
  li.livepaused .time::after { content: " • pause"; color: #b45309; font-weight: 600; }
  li button.del {
    border: none; background: transparent; color: #94a3b8; cursor: pointer;
    font-size: 24px; line-height: 1;
    width: 44px; height: 44px;
    border-radius: 10px;
  }
  li button.del:active { background: #fee2e2; color: #b91c1c; }
  .empty { color: #94a3b8; font-size: 15px; padding: 10px 4px 2px; }
  #resetDay {
    margin-top: 10px; border: none; background: transparent;
    color: #94a3b8; font-size: 15px; cursor: pointer; text-decoration: underline;
    padding: 12px 4px;
    min-height: 44px;
  }
  #resetDay:active { color: #b91c1c; }
</style>
</head>
<body>
  <div id="confetti" aria-hidden="true"></div>

  <div class="wrap">
    <button id="flexBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4l2.5 2.5"/>
        <path d="M9 2h6"/>
        <path d="M12 2v3"/>
      </svg>
      <span class="label">Flex</span>
      <span class="timer" id="timer">00:00</span>
    </button>

    <div>
      <button id="pauseBtn" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="pauseIcon">
          <rect x="6" y="5" width="4" height="14" rx="1"/>
          <rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
        <span id="pauseText">Pause</span>
      </button>
    </div>

    <div id="status">Flex er av</div>

    <section class="card" aria-label="Dagsoversikt">
      <div class="card-head">
        <h2>Dagsoversikt</h2>
        <span class="date" id="today"></span>
      </div>
      <div class="total">
        <span class="t-label">Flex brukt i dag</span>
        <span class="t-value" id="totalToday">0 min</span>
      </div>
      <div class="count" id="count"></div>
      <ul id="list"></ul>
      <button id="resetDay" type="button">Nullstill dagen</button>
    </section>
  </div>

<script>
  // ---------- Lagring (faller tilbake til minne hvis localStorage er blokkert) ----------
  const KEY = "flexState_v2";
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  };

  // state: { days: { "YYYY-MM-DD": [ {id, start, end, ms} ] },
  //          active: null | { start, acc, seg } }
  //   start = tidspunkt flex startet, acc = opptjent ms, seg = start på løpende segment (null = pause)
  let state = { days: {}, active: null };
  try {
    const raw = store.get(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  function save() { store.set(KEY, JSON.stringify(state)); }

  // ---------- Hjelpefunksjoner ----------
  const $ = id => document.getElementById(id);
  const btn = $("flexBtn"), pauseBtn = $("pauseBtn"), timerEl = $("timer"),
        statusEl = $("status"), listEl = $("list"), totalEl = $("totalToday"),
        countEl = $("count"), pauseText = $("pauseText"), pauseIcon = $("pauseIcon");

  const PAUSE_SVG = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';

  const pad = n => String(n).padStart(2, "0");
  function dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function clock(ts) {
    const d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function mmss(ms) {
    const t = Math.floor(ms / 1000);
    return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
  }
  function long(ms) {
    const t = Math.floor(ms / 1000);
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    if (h > 0) return h + " t " + pad(m) + " min";
    if (m > 0) return m + " min " + pad(s) + " s";
    return s + " s";
  }
  function activeMs() {
    const a = state.active;
    if (!a) return 0;
    return a.acc + (a.seg ? Date.now() - a.seg : 0);
  }

  // ---------- Konfetti- og ølregn ----------
  const confettiEl = $("confetti");
  const COLORS = ["#ef4444", "#f59e0b", "#facc15", "#22c55e", "#06b6d4", "#3b82f6", "#a855f7", "#ec4899"];
  const MAX_ELEMENTS = 140;          // holder animasjonen jevn på iPhone
  let confettiTimer = null, beerTimer = null;
  const small = window.innerWidth < 500;

  function spawnDrop() {                                   // ølglass
    if (confettiEl.childElementCount > MAX_ELEMENTS) return;
    const el = document.createElement("span");
    el.className = "drop";
    el.textContent = "🍻";
    const dur = 5 + Math.random() * 4;                     // 5–9 s
    el.style.left = (Math.random() * 90) + "vw";
    el.style.fontSize = (small ? 44 + Math.random() * 36 : 48 + Math.random() * 44) + "px";
    el.style.opacity = (0.65 + Math.random() * 0.35).toFixed(2);
    el.style.animationDuration = dur + "s";
    el.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
    el.style.setProperty("--spin", (Math.random() * 540 - 270) + "deg");
    el.addEventListener("animationend", () => el.remove());
    confettiEl.appendChild(el);
  }

  function spawnPiece() {                                  // ekte konfetti
    if (confettiEl.childElementCount > MAX_ELEMENTS) return;
    const el = document.createElement("span");
    el.className = "piece";
    const w = 6 + Math.random() * 8;                       // 6–14 px
    const round = Math.random() < 0.3;
    el.style.width = w + "px";
    el.style.height = (round ? w : w * (0.4 + Math.random() * 0.6)) + "px";
    el.style.borderRadius = round ? "50%" : "2px";
    el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.left = (Math.random() * 100) + "vw";
    const dur = 3 + Math.random() * 4;                     // 3–7 s
    el.style.animationDuration = dur + "s, " + (0.6 + Math.random() * 0.9) + "s";
    el.style.setProperty("--drift", (Math.random() * 160 - 80) + "px");
    el.style.setProperty("--sway", (Math.random() * 40 - 20) + "px");
    el.style.setProperty("--spin", (Math.random() * 1440 - 720) + "deg");
    el.addEventListener("animationend", e => { if (e.animationName === "fall") el.remove(); });
    confettiEl.appendChild(el);
  }

  function syncConfetti(on) {
    if (on && !confettiTimer) {
      for (let i = 0; i < 30; i++) setTimeout(spawnPiece, i * 30);   // kjapp konfetti-salve
      for (let i = 0; i < 4; i++) setTimeout(spawnDrop, i * 140);
      confettiTimer = setInterval(spawnPiece, 90);
      beerTimer = setInterval(spawnDrop, 340);
    } else if (!on && confettiTimer) {
      clearInterval(confettiTimer);
      clearInterval(beerTimer);
      confettiTimer = beerTimer = null;            // det som allerede faller, faller ferdig
    }
  }

  // ---------- Visning ----------
  function render() {
    const a = state.active;
    const running = a && a.seg;
    const paused = a && !a.seg;

    btn.classList.toggle("on", !!running);
    btn.classList.toggle("paused", !!paused);
    btn.setAttribute("aria-pressed", a ? "true" : "false");
    timerEl.textContent = mmss(activeMs());

    pauseBtn.disabled = !a;
    pauseBtn.classList.toggle("resume", !!paused);
    pauseText.textContent = paused ? "Fortsett" : "Pause";
    pauseIcon.innerHTML = paused ? PLAY_SVG : PAUSE_SVG;

    statusEl.className = running ? "on" : paused ? "paused" : "";
    statusEl.textContent = running ? "Du har nå fri. Føl deg fri."
                         : paused ? "Pause – timeren står stille"
                         : "Flex er av";

    $("today").textContent = new Date().toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
    renderOverview();
    syncConfetti(!!running);
  }

  function renderOverview() {
    const today = dayKey(Date.now());
    const sessions = state.days[today] || [];
    const a = state.active;
    const liveToday = a && dayKey(a.start) === today;

    let total = sessions.reduce((sum, s) => sum + s.ms, 0);
    if (liveToday) total += activeMs();
    totalEl.textContent = long(total);

    const n = sessions.length + (liveToday ? 1 : 0);
    countEl.textContent = n === 0 ? "" : n + (n === 1 ? " flex-økt i dag" : " flex-økter i dag");

    listEl.innerHTML = "";
    if (n === 0) {
      listEl.innerHTML = '<div class="empty">Ingen flex-økter registrert i dag.</div>';
    }
    if (liveToday) {
      const li = document.createElement("li");
      li.className = a.seg ? "live" : "livepaused";
      li.innerHTML = '<span class="time">' + clock(a.start) + ' –</span><span class="dur">' + mmss(activeMs()) + '</span><span style="width:44px"></span>';
      listEl.appendChild(li);
    }
    sessions.slice().reverse().forEach(s => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="time">' + clock(s.start) + ' – ' + clock(s.end) + '</span>' +
                     '<span class="dur">' + mmss(s.ms) + '</span>';
      const del = document.createElement("button");
      del.className = "del"; del.title = "Slett økt"; del.setAttribute("aria-label", "Slett økt"); del.textContent = "×";
      del.onclick = () => {
        state.days[today] = (state.days[today] || []).filter(x => x.id !== s.id);
        save(); render();
      };
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  // ---------- Handlinger ----------
  btn.addEventListener("click", () => {
    if (!state.active) {
      const now = Date.now();
      state.active = { start: now, acc: 0, seg: now };
    } else {
      const a = state.active;
      const ms = activeMs();
      const key = dayKey(a.start);
      (state.days[key] = state.days[key] || []).push({
        id: Date.now() + "" + Math.random().toString(36).slice(2, 6),
        start: a.start, end: Date.now(), ms: ms
      });
      state.active = null;
    }
    save(); render();
  });

  pauseBtn.addEventListener("click", () => {
    const a = state.active;
    if (!a) return;
    if (a.seg) { a.acc += Date.now() - a.seg; a.seg = null; }  // pause
    else { a.seg = Date.now(); }                                // fortsett
    save(); render();
  });

  $("resetDay").addEventListener("click", () => {
    if (confirm("Nullstille alle flex-økter for i dag?")) {
      delete state.days[dayKey(Date.now())];
      save(); render();
    }
  });

  // ---------- iPhone: håndter at appen settes i bakgrunnen og hentes frem igjen ----------
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      confettiEl.innerHTML = "";   // rydd bort gamle elementer etter bakgrunn
      render();                    // timeren regnes ut fra starttidspunkt, så den er alltid riktig
    }
  });
  window.addEventListener("pageshow", render);

  // Hindre pinch-zoom og dobbelttrykk-zoom i appen
  ["gesturestart", "gesturechange", "gestureend"].forEach(t =>
    document.addEventListener(t, e => e.preventDefault()));

  // ---------- Oppstart ----------
  render();
  setInterval(() => { if (state.active && state.active.seg) render(); }, 500);
</script>
</body>
</html>
